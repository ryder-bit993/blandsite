<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Python Script Runner</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        select { flex-grow: 1; border: 1px solid #ccc; }
        button {
            background-color: #2da44e;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2c974b; }
        pre {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
        }
        #code-display { background-color: #f4f4f4; color: #333; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Repository Script Runner</h2>
    
    <div class="controls">
        <label for="script-select"><strong>Select Script:</strong></label>
        <select id="script-select">
            <option value="">Loading scripts from repository...</option>
        </select>
        <button id="run-btn">Run Script</button>
    </div>

    <h3>Script Source Code:</h3>
    <pre id="code-display">Select a script from the dropdown to view its code...</pre>

    <h3>Console Output:</h3>
    <pre id="output-terminal">Ready to run...</pre>
</div>

<!-- Fetch files from GitHub REST API -->
<script>
    const GITHUB_USERNAME = "your-username"; 
    const REPO_NAME = "your-repo-name";
    const FOLDER_PATH = "scripts";

    const selectElement = document.getElementById("script-select");
    const codeDisplay = document.getElementById("code-display");
    window.fileContent = ""; 

    async function fetchScriptList() {
        const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FOLDER_PATH}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Could not find '/scripts' folder in repository.");
            
            const files = await response.json();
            selectElement.innerHTML = '<option value="">-- Choose a script --</option>';

            const pyFiles = files.filter(file => file.name.endsWith('.py'));

            if (pyFiles.length === 0) {
                selectElement.innerHTML = '<option value="">No .py files found in /scripts</option>';
                return;
            }

            pyFiles.forEach(file => {
                const option = document.createElement("option");
                option.value = file.download_url; 
                option.textContent = file.name;
                selectElement.appendChild(option);
            });
        } catch (error) {
            selectElement.innerHTML = `<option value="">Error: ${error.message}</option>`;
        }
    }

    selectElement.addEventListener("change", async (event) => {
        const downloadUrl = event.target.value;
        if (!downloadUrl) {
            codeDisplay.innerText = "Select a script from the dropdown to view its code...";
            window.fileContent = "";
            return;
        }

        codeDisplay.innerText = "Loading script code...";
        try {
            const response = await fetch(downloadUrl);
            window.fileContent = await response.text();
            codeDisplay.innerText = window.fileContent;
        } catch (error) {
            codeDisplay.innerText = `Failed to load script content: ${error.message}`;
        }
    });

    fetchScriptList();
</script>

<!-- PyScript Execution -->
<script type="mpy">
from js import window, document
import sys

def custom_write(text):
    """Appends printed text directly to the console area."""
    term = document.getElementById("output-terminal")
    term.innerText += str(text)
    term.scrollTop = term.scrollHeight

def custom_print(*args, sep=' ', end='\n'):
    output = sep.join(map(str, args)) + end
    custom_write(output)

def custom_input(prompt_msg=""):
    custom_write(prompt_msg)
    result = window.prompt(prompt_msg)
    custom_write(f"{result or ''}\n")
    return result if result is not None else ""

def run_script(event):
    output_element = document.getElementById("output-terminal")
    script_code = window.fileContent
    
    if not script_code:
        output_element.innerText = "Error: Please select a script from the dropdown first."
        return

    output_element.innerText = ""

    # Build execution context with imported modules and custom I/O
    exec_scope = {
        'sys': sys,
        'print': custom_print,
        'input': custom_input,
        '__name__': '__main__'
    }

    # Redirect sys.stdout directly in PyScript scope
    class CustomStdout:
        def write(self, s):
            custom_write(s)
        def flush(self):
            pass

    sys.stdout = CustomStdout()

    try:
        exec(script_code, exec_scope)
    except Exception as e:
        output_element.innerText += f"\nExecution Error:\n{e}"

document.getElementById("run-btn").addEventListener("click", run_script)
</script>

</body>
</html>
