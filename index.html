<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Python Script Runner</title>
    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }
        select { flex-grow: 1; border: 1px solid #ccc; }
        button {
            background-color: #2da44e;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2c974b; }
        .terminal-container {
            background-color: #1e1e1e;
            border-radius: 6px;
            padding: 15px;
            min-height: 200px;
            max-height: 450px;
            display: flex;
            flex-direction: column;
        }
        #output-terminal {
            color: #d4d4d4;
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            margin: 0;
        }
        .input-bar {
            display: none;
            margin-top: 10px;
            gap: 10px;
        }
        .input-bar.active {
            display: flex;
        }
        #terminal-input {
            flex-grow: 1;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        #terminal-input:focus {
            outline: 1px solid #2da44e;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Repository Script Runner</h2>
    
    <div class="controls">
        <label for="script-select"><strong>Select Script:</strong></label>
        <select id="script-select">
            <option value="">Loading scripts from repository...</option>
        </select>
        <button id="run-btn">Run Script</button>
    </div>

    <h3>Console Output:</h3>
    <div class="terminal-container">
        <pre id="output-terminal">Ready to run...</pre>
        <div id="input-bar" class="input-bar">
            <input type="text" id="terminal-input" placeholder="Type your response here and press Enter..." />
            <button id="input-submit-btn">Send</button>
        </div>
    </div>
</div>

<!-- Fetch file list from GitHub REST API -->
<script>
    const GITHUB_USERNAME = "ryder-bit993"; 
    const REPO_NAME = "blandsite";
    const FOLDER_PATH = "scripts";

    const selectElement = document.getElementById("script-select");
    window.fileContent = ""; 

    async function fetchScriptList() {
        const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FOLDER_PATH}`;
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Could not find '/scripts' folder in repository.");
            
            const files = await response.json();
            selectElement.innerHTML = '<option value="">-- Choose a script --</option>';

            const pyFiles = files.filter(file => file.name.endsWith('.py'));

            if (pyFiles.length === 0) {
                selectElement.innerHTML = '<option value="">No .py files found in /scripts</option>';
                return;
            }

            pyFiles.forEach(file => {
                const option = document.createElement("option");
                option.value = file.download_url; 
                option.textContent = file.name;
                selectElement.appendChild(option);
            });
        } catch (error) {
            selectElement.innerHTML = `<option value="">Error: ${error.message}</option>`;
        }
    }

    selectElement.addEventListener("change", async (event) => {
        const downloadUrl = event.target.value;
        if (!downloadUrl) {
            window.fileContent = "";
            return;
        }

        try {
            const response = await fetch(downloadUrl);
            window.fileContent = await response.text();
        } catch (error) {
            document.getElementById("output-terminal").innerText = `Failed to load script content: ${error.message}`;
        }
    });

    fetchScriptList();
</script>

<!-- PyScript Execution with In-Terminal Input Support -->
<script type="mpy">
from js import window, document
import asyncio

def write_to_terminal(text):
    term = document.getElementById("output-terminal")
    term.innerText += str(text)
    term.scrollTop = term.scrollHeight

class MockStdout:
    def write(self, s):
        write_to_terminal(s)
    def flush(self):
        pass

class MockSys:
    def __init__(self):
        self.stdout = MockStdout()
    def exit(self, code=0):
        write_to_terminal("\n[Script ended]")

async def custom_input_async(prompt_msg=""):
    write_to_terminal(prompt_msg)
    
    input_bar = document.getElementById("input-bar")
    input_field = document.getElementById("terminal-input")
    submit_btn = document.getElementById("input-submit-btn")
    
    input_bar.classList.add("active")
    input_field.focus()
    input_field.value = ""

    loop = asyncio.get_running_loop()
    future = loop.create_future()

    def handle_submit(event=None):
        if event and hasattr(event, "key") and event.key != "Enter":
            return
        user_val = input_field.value
        input_bar.classList.remove("active")
        write_to_terminal(f"{user_val}\n")
        if not future.done():
            future.set_result(user_val)

    submit_btn.onclick = handle_submit
    input_field.onkeyup = handle_submit

    result = await future
    return result

def custom_print(*args, sep=' ', end='\n'):
    output = sep.join(map(str, args)) + end
    write_to_terminal(output)

async def run_script_async(event):
    output_element = document.getElementById("output-terminal")
    script_code = window.fileContent
    
    if not script_code:
        output_element.innerText = "Error: Please select a script from the dropdown first."
        return

    output_element.innerText = ""
    mock_sys = MockSys()

    exec_scope = {
        'sys': mock_sys,
        'print': custom_print,
        'input': custom_input_async,
        '__name__': '__main__'
    }

    try:
        # Transform standard sync input calls into async await for the terminal UI
        modified_code = script_code.replace("input(", "await input(")
        async_wrapper = f"async def __main_async__():\n" + "\n".join(["    " + line for line in modified_code.splitlines()]) + "\n"
        
        exec(async_wrapper, exec_scope)
        await exec_scope['__main_async__']()
    except Exception as e:
        output_element.innerText += f"\nExecution Error:\n{e}"

def on_run_click(event):
    asyncio.create_task(run_script_async(event))

document.getElementById("run-btn").addEventListener("click", on_run_click)
</script>

</body>
</html>
